# Capa 0 del sistema autónomo (docs/sistema-autonomo.md): medir la calidad sola.
#
# POR QUÉ SEMANAL Y NO DIARIO. `npm run metricas` ejecuta las evaluaciones
# completas: ~400 embeddings de OpenAI y una docena de llamadas a Claude. Son
# céntimos, pero no cero, y la calidad no cambia de un día para otro. Lo que sí
# se mide continuamente es el uso real, que ya se registra en cada consulta.
#
# POR QUÉ AQUÍ Y NO EN EL SERVIDOR. Si el servidor está caído, el vigilante que
# vive dentro también lo está.
name: calidad

on:
  schedule:
    # Lunes a las 07:00 UTC. Que el resultado esté antes de empezar la semana.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

# El token de Actions es de SOLO LECTURA por defecto en este repositorio
# (comprobado: default_workflow_permissions = read). Sin declarar esto, `gh issue
# create` daba 403 y la capa de aviso entera no funcionaba: el único síntoma
# habría sido una X en un workflow programado de un repo privado, que es como no
# avisar. Lo encontró una revisión independiente; nunca se había probado la rama
# de alarma porque la única ejecución salió verde.
permissions:
  contents: read
  issues: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Medir y guardar
        id: medir
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sin esto, el aviso de "quien paga y ha dejado de venir" cuenta las
          # cuentas de prueba y llega todas las semanas por ellas.
          CEREBRO_CUENTAS_INTERNAS: ${{ vars.CEREBRO_CUENTAS_INTERNAS }}
        run: |
          # La salida se guarda para poder meterla en la issue: un aviso que
          # solo dice "algo falla" obliga a ir a buscarlo, y entonces no se va.
          npm run metricas 2>&1 | tee salida.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

          # DOS ROJOS DISTINTOS, y confundirlos costó dos semanas sin medir: la
          # clave de Supabase se quedó revocada, `calidad` empezó a fallar, y
          # parecía el rojo de siempre —los suelos, que están bajos por decisión
          # tomada—. El script ya los separa; aquí solo se leen sus líneas.
          resumen=$(grep -m1 '^RESUMEN ' salida.txt || echo "RESUMEN averias=1 empeoramientos=0 bajo_suelo=0 avisos=0")
          # El grep va SOLO, sin tubería: `grep ... | cut` devuelve el código de
          # `cut`, siempre 0, así que el `|| echo` de respaldo no saltaba nunca
          # y un informe que ni llegó a imprimir el motivo daba motivo vacío.
          motivo=$(grep -m1 '^MOTIVO ' salida.txt || true)
          motivo=${motivo:-"MOTIVO el informe no llegó a terminar"}
          motivo=${motivo#MOTIVO }
          averias=$(echo "$resumen" | sed -n 's/.*averias=\([0-9]*\).*/\1/p')
          echo "averias=${averias:-1}" >> "$GITHUB_OUTPUT"
          echo "motivo=$motivo" >> "$GITHUB_OUTPUT"

          # Los silencios van APARTE del veredicto y con su propio correo: no hay
          # nada roto, pero es lo unico de este informe que caduca. Un cliente al
          # que se le ha caido la conexion decide en dias si le compensa
          # insistir, y la incidencia de GitHub no la abre nadie hasta el lunes.
          silencios=$(grep -m1 '^SILENCIOS ' salida.txt || true)
          dormidas=$(echo "$silencios" | sed -n 's/.*dormidas=\([0-9]*\).*/\1/p')
          echo "dormidas=${dormidas:-0}" >> "$GITHUB_OUTPUT"
          echo "silencios=${silencios#SILENCIOS }" >> "$GITHUB_OUTPUT"

          # Lo que va a la issue se recorta: el informe incluye el top de
          # `huecos_de_contenido`, o sea PREGUNTAS LITERALES de comerciales sobre
          # sus operaciones. La migración que crea esa tabla las etiqueta como
          # dato sensible con borrado a los 30 días, y las issues de GitHub no
          # caducan. Se publica solo el bloque de medidas.
          sed -n '/=== calidad/,/=== lo que se pregunta/p' salida.txt \
            | sed '/=== lo que se pregunta/d' > publicable.txt
          echo "" >> publicable.txt
          echo "(El detalle de consultas no se publica aquí: es dato sensible con retención de 30 días. Míralo con: npm run metricas)" >> publicable.txt

          # El veredicto se imprime al final del informe, o sea DESPUÉS del
          # bloque de preguntas que no se publica. Sin esto, la issue enseñaba
          # las medidas y no decía por qué había fallado.
          grep -E '^(NO SE PUDO MEDIR|HA EMPEORADO)' -A6 salida.txt >> publicable.txt || true

      # La retención estaba declarada en la migración y en la
      # política, y no la ejecutaba nadie: "se borra a los 90 días" era una
      # intención, no un hecho. Va después de medir para que el informe vea la
      # semana entera, y sin `continue-on-error` porque una retención que falla
      # en silencio es exactamente lo que había antes.
      - name: Borrar el registro pasada la retención
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run metricas -- --limpiar

      # POR QUÉ ESTO VA POR CORREO Y LA ISSUE NO BASTA. Una avería es no haber
      # podido medir, y entonces el histórico deja de crecer sin que nada lo
      # diga: el panel sigue enseñando la última cifra buena como si fuera de
      # hoy. Eso puede estar así semanas —lo estuvo—, y las issues de un repo
      # privado no las abre nadie. Solo para averías: un correo semanal por un
      # suelo que ya se decidió mantener en rojo se aprende a borrar sin leer.
      - name: Avisar por correo si no se pudo medir
        if: steps.medir.outputs.averias != '0'
        env:
          RESEND: ${{ secrets.RESEND_API_KEY }}
          PARA: ${{ vars.CEREBRO_AVISO_EMAIL }}
          MOTIVO: ${{ steps.medir.outputs.motivo }}
        run: |
          if [ -z "$RESEND" ] || [ -z "$PARA" ]; then
            echo "SIN AVISO: falta RESEND_API_KEY o la variable CEREBRO_AVISO_EMAIL."
            echo "La issue se abrirá igual, pero nadie recibirá un correo."
            exit 0
          fi

          cuerpo=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "La medición semanal de calidad NO PUDO MEDIR: $MOTIVO" \
            "Mientras siga así no hay dato nuevo, y el panel enseña la última cifra buena como si fuera de hoy." \
            "$(cat publicable.txt)" \
            "Detalle completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          # --fail-with-body para que un envío rechazado salga en rojo aquí en
          # vez de darse por enviado, igual que en `salud`.
          curl -sS --fail-with-body -m 20 -X POST "https://api.resend.com/emails" \
            -H "authorization: Bearer $RESEND" \
            -H "content-type: application/json" \
            -d "$(jq -n --arg p "$PARA" --arg t "$cuerpo" \
                  '{from:"Cerebro <hola@correo.cofundo.io>", to:[$p], subject:"[cerebro] la calidad no se pudo medir", text:$t}')"

      # POR QUE ESTE AVISO NO ESPERA AL LUNES. Teresa, de SciScreen, hizo 20
      # consultas el 2, 3 y 4 de septiembre y luego nada. El 23 nos enteramos de
      # que se le habia caido la conexion, y nos enteramos porque lo dijo ella:
      # 19 dias en los que pagaba y no tenia producto. La señal estaba en la base
      # desde el dia 7. Este correo es para que la proxima vez lo diga la base.
      #
      # No manda las consultas, solo quien y cuantos dias: lo que la gente
      # pregunta es dato sensible con retencion de 30 dias, y un correo no caduca.
      - name: Avisar por correo si alguien que paga ha dejado de venir
        if: steps.medir.outputs.dormidas != '0' && steps.medir.outputs.dormidas != ''
        env:
          RESEND: ${{ secrets.RESEND_API_KEY }}
          PARA: ${{ vars.CEREBRO_AVISO_EMAIL }}
          SILENCIOS: ${{ steps.medir.outputs.silencios }}
          CUANTAS: ${{ steps.medir.outputs.dormidas }}
        run: |
          if [ -z "$RESEND" ] || [ -z "$PARA" ]; then
            echo "SIN AVISO: falta RESEND_API_KEY o la variable CEREBRO_AVISO_EMAIL."
            exit 0
          fi

          cuerpo=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "$CUANTAS cuenta(s) con suscripcion activa han dejado de usar el cerebro." \
            "$SILENCIOS" \
            "Antes de darlo por perdido: mirar si se les ha caido la conexion. Una autorizacion anterior al 09/09/2026 no tiene refresh token y se muere sola; se arregla reconectando una vez." \
            "Comprobar quien: https://cerebro.cofundo.io/admin" \
            "Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")

          curl -sS --fail-with-body -m 20 -X POST "https://api.resend.com/emails" \
            -H "authorization: Bearer $RESEND" \
            -H "content-type: application/json" \
            -d "$(jq -n --arg p "$PARA" --arg s "[cerebro] $CUANTAS cuenta(s) de pago sin usarlo" --arg t "$cuerpo" \
                  '{from:"Cerebro <hola@correo.cofundo.io>", to:[$p], subject:$s, text:$t}')"

      - name: Avisar si hay algo que mirar
        if: steps.medir.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MOTIVO: ${{ steps.medir.outputs.motivo }}
        run: |
          # Una sola issue abierta a la vez. Sin esto, ocho semanas rotas son
          # ocho issues idénticas y nadie abre ninguna.
          abierta=$(gh issue list --label calidad --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$abierta" ]; then
            gh issue comment "$abierta" --body "$(printf 'Sigue así el %s: %s\n\n```\n%s\n```' "$(date -u +%F)" "$MOTIVO" "$(cat publicable.txt)")"
          else
            gh label create calidad --color B60205 --description "Medidas fuera de los suelos de reglas-duras.md" 2>/dev/null || true
            # El título dice CUÁL de los dos rojos es, porque es lo único que se
            # lee desde la bandeja de entrada.
            if [ "${{ steps.medir.outputs.averias }}" != "0" ]; then
              titulo="No se pudo medir la calidad — $(date -u +%F)"
              que="No es una nota baja: es que la medición no llegó a hacerse, así que no hay dato nuevo. Qué mirar: las credenciales del workflow (\`SUPABASE_SECRET_KEY\`, \`OPENAI_API_KEY\`, \`ANTHROPIC_API_KEY\`) y el log de la ejecución."
            else
              titulo="La calidad ha empeorado — $(date -u +%F)"
              que="Una medida ha bajado respecto a la anterior, no solo respecto al suelo. Qué mirar: qué se desplegó desde la última medición, y \`salud_de_la_busqueda\` en la base."
            fi
            gh issue create \
              --label calidad \
              --title "$titulo" \
              --body "$(printf '**%s**\n\n%s\n\n```\n%s\n```' "$MOTIVO" "$que" "$(cat publicable.txt)")"
          fi

      - name: Cerrar la issue si todo volvió a su sitio
        if: steps.medir.outputs.codigo == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Que se cierre sola evita el otro fallo típico: una issue vieja
          # abierta de algo ya arreglado, que enseña a ignorar la etiqueta.
          for n in $(gh issue list --label calidad --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Se ha vuelto a medir y no hay nada nuevo que mirar ($(date -u +%F)). Los suelos pueden seguir en rojo: eso es el estado conocido, no una avería."
          done

      - name: Fallar si hubo problema
        if: steps.medir.outputs.codigo != '0'
        run: exit 1
